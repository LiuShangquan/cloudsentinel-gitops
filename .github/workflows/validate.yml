name: validate-gitops

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desired-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reject unconfigured or unsafe desired state
        shell: bash
        run: |
          set -euo pipefail
          active_paths=(
            apps/cloudsentinel/base
            apps/cloudsentinel/overlays/lab-staging
            apps/cloudsentinel/overlays/lab-production
            apps/cloudsentinel/overlays/compact-lab-staging
            apps/cloudsentinel/overlays/compact-lab-production
            bootstrap
            platform/cloudsentinel-data/overlays/lab
            platform/cloudsentinel-data/overlays/lab-compact
            platform/cloudsentinel-monitoring/overlays/lab
            platform/cloudsentinel-monitoring/overlays/lab-compact
            platform/cloudsentinel-secrets/overlays/lab-staging
            platform/cloudsentinel-secrets/overlays/lab-production
            platform/cloudsentinel-secrets/overlays/lab-data
          )
          if grep -RInE 'REPLACE_[A-Z0-9_]+|REPLACE_ORG|REPLACE_DOMAIN' "${active_paths[@]}"; then
            echo 'GitOps placeholders must be replaced before merge.' >&2
            exit 1
          fi
          if grep -RInE 'MONITORING_[A-Z_]+_DIGEST' \
            platform/cloudsentinel-monitoring/overlays/lab; then
            echo 'Monitoring image digests must be populated by the mirror workflow before merge.' >&2
            exit 1
          fi
          for environment in compact-lab-staging compact-lab-production; do
            output="$(mktemp)"
            kubectl kustomize "apps/cloudsentinel/overlays/${environment}" >"${output}"
            if grep -Eq '^kind: (Secret|StatefulSet)$' "${output}"; then
              echo "forbidden Secret or StatefulSet in ${environment}" >&2
              exit 1
            fi
            if grep -Eq 'image: .*:latest([[:space:]]|$)' "${output}"; then
              echo "mutable image tag in ${environment}" >&2
              exit 1
            fi
            grep -Eq 'image: .+@sha256:[0-9a-f]{64}$' "${output}"
            for component in api worker migrate; do
              component_image_count="$(grep -Ec "image: crpi-1s64ln3ptbvgkqof\\.cn-beijing\\.personal\\.cr\\.aliyuncs\\.com/cloudsentinel0306/cloudsentinel-${component}@sha256:[0-9a-f]{64}$" "${output}")"
              test "${component_image_count}" -eq 1
            done
            web_image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-web@sha256:[0-9a-f]{64}$' "${output}")"
            if [[ "${environment}" == "compact-lab-staging" ]]; then
              test "${web_image_count}" -eq 2
            else
              test "${web_image_count}" -eq 1
            fi
          done
          migration_job=apps/cloudsentinel/base/migration-job.yaml
          grep -q '^      serviceAccountName: default$' "${migration_job}"
          grep -q '^      automountServiceAccountToken: false$' "${migration_job}"
          grep -A1 '^      imagePullSecrets:$' "${migration_job}" |
            grep -q '^        - name: cloudsentinel-registry$'
          data_output="$(mktemp)"
          kubectl kustomize platform/cloudsentinel-data/overlays/lab-compact >"${data_output}"
          test "$(grep -c '^kind: StatefulSet$' "${data_output}")" -eq 2
          test "$(grep -c '^kind: PersistentVolume$' "${data_output}")" -eq 3
          test "$(grep -c '^  persistentVolumeReclaimPolicy: Retain$' "${data_output}")" -eq 3
          test "$(grep -c '^volumeBindingMode: Immediate$' "${data_output}")" -eq 1
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-30\"' "${data_output}")" -eq 12
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-20\"' "${data_output}")" -eq 2
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-10\"' "${data_output}")" -eq 1
          test "$(grep -Ec '^[[:space:]]+workload\.cloudsentinel\.io/data: "true"$' "${data_output}")" -eq 5
          test "$(grep -Ec '^[[:space:]]+- worker-01$' "${data_output}")" -eq 3
          if grep -Eq '^  type: (NodePort|LoadBalancer)$' "${data_output}"; then
            echo 'data services must remain private ClusterIP services.' >&2
            exit 1
          fi
          data_image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-(mysql|redis)@sha256:[0-9a-f]{64}$' "${data_output}")"
          test "${data_image_count}" -eq 6
          monitoring_output="$(mktemp)"
          kubectl kustomize platform/cloudsentinel-monitoring/overlays/lab-compact >"${monitoring_output}"
          test "$(grep -c '^kind: StatefulSet$' "${monitoring_output}")" -eq 2
          test "$(grep -c '^kind: Deployment$' "${monitoring_output}")" -eq 2
          test "$(grep -c '^kind: PersistentVolume$' "${monitoring_output}")" -eq 3
          test "$(grep -c '^  persistentVolumeReclaimPolicy: Retain$' "${monitoring_output}")" -eq 3
          test "$(grep -Ec '^[[:space:]]+workload\.cloudsentinel\.io/monitoring: "true"$' "${monitoring_output}")" -eq 4
          test "$(grep -Ec '^[[:space:]]+- worker-02$' "${monitoring_output}")" -eq 3
          test "$(grep -c 'cidr: 172.23.122.231/32' "${monitoring_output}")" -eq 1
          test "$(grep -c 'cidr: 172.23.122.232/32' "${monitoring_output}")" -eq 1
          test "$(grep -c 'cidr: 172.23.122.233/32' "${monitoring_output}")" -eq 1
          monitoring_image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-(prometheus|alertmanager|grafana|metrics-server)@sha256:[0-9a-f]{64}$' "${monitoring_output}")"
          test "${monitoring_image_count}" -eq 4
          grep -Fq 'credentials_file: /etc/alertmanager/secrets/webhook-token' "${monitoring_output}"
          test "$(grep -c '^  type: NodePort$' "${monitoring_output}")" -eq 1
          test "$(grep -c '^  externalTrafficPolicy: Local$' "${monitoring_output}")" -eq 1
          test "$(grep -c '^    nodePort: 30300$' "${monitoring_output}")" -eq 1
          test "$(grep -c '^  type: LoadBalancer$' "${monitoring_output}")" -eq 0
          grep -Fq 'name: grafana-public' "${monitoring_output}"
          grep -Fq 'name: grafana-public-tls' "${monitoring_output}"
          test "$(grep -Ec '^[[:space:]]+- cloudsentinel-grafana-public-tls$' bootstrap/secret-store/rbac.yaml)" -eq 1
          if grep -RIn 'newName: crpi-1s64ln3ptbvgkqof\.cn-beijing\.personal\.cr\.aliyuncs\.com' apps/cloudsentinel/base apps/cloudsentinel/overlays/lab-staging apps/cloudsentinel/overlays/lab-production; then
            echo 'legacy Beijing overlays must retain the ACR VPC endpoint.' >&2
            exit 1
          fi
          kubectl kustomize bootstrap/secret-store >/dev/null
          kubectl kustomize platform/cloudsentinel-secrets/overlays/lab-data >/dev/null
          kubectl kustomize bootstrap/argocd >/dev/null
